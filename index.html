<title>Cocina CC-1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: tablero de instrumentos. Columna de trabajo + bitácora viva fija a la derecha
   (hoja inferior en teléfono). Franja de estado del modelo bajo la cabecera.
   Color: sólo los dos del contenido (físico/químico) más veredicto; el resto es grafito. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F1; --sunk:#EBEBE5;
  --ink:#16161A; --ink-2:#56565F; --ink-3:#8A8A93; --line:#DCDCD5; --edge:#16161A;
  --fis:#1B44D8; --fis-bg:#E7EBFF; --qui:#D8401A; --qui-bg:#FFE9E1;
  --ok:#15764A; --ok-bg:#DCF2E6; --err:#C01B1B; --err-bg:#FFE4E1;
  --warn:#8F6300; --warn-bg:#FFF3CC; --hl:#16161A; --hl-bg:#FFE45C;
  --panel:#16161A; --panel-ink:#FFFFFF; --pop:#FFE45C;
  --r:14px; --r-s:9px;
  --display:"Darker Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101014; --surface:#1A1A20; --surface-2:#22222A; --sunk:#0A0A0D;
  --ink:#F1F1EF; --ink-2:#AEAEB8; --ink-3:#86868F; --line:#2E2E36; --edge:#43434F;
  --fis:#93A9FF; --fis-bg:#1B2246; --qui:#FF9166; --qui-bg:#3C1E12;
  --ok:#63CB93; --ok-bg:#12301F; --err:#FF8A86; --err-bg:#3B1A18;
  --warn:#E7B74E; --warn-bg:#352A10; --hl:#F1F1EF; --hl-bg:#4B4000;
  --panel:#07070A; --panel-ink:#FFFFFF; --pop:#FFE45C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101014; --surface:#1A1A20; --surface-2:#22222A; --sunk:#0A0A0D;
  --ink:#F1F1EF; --ink-2:#AEAEB8; --ink-3:#86868F; --line:#2E2E36; --edge:#43434F;
  --fis:#93A9FF; --fis-bg:#1B2246; --qui:#FF9166; --qui-bg:#3C1E12;
  --ok:#63CB93; --ok-bg:#12301F; --err:#FF8A86; --err-bg:#3B1A18;
  --warn:#E7B74E; --warn-bg:#352A10; --hl:#F1F1EF; --hl-bg:#4B4000;
  --panel:#07070A; --panel-ink:#FFFFFF; --pop:#FFE45C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fis);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--panel);color:var(--panel-ink)}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;max-width:1240px;margin:0 auto}
.brand{font-family:var(--display);font-weight:900;font-size:25px;letter-spacing:-.035em;display:flex;align-items:center;gap:9px;color:var(--panel-ink)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--pop)}
.modes{margin-left:auto;display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.modes button{background:none;border:0;border-radius:999px;font-family:var(--body);font-weight:600;font-size:12px;padding:5px 12px;color:rgba(255,255,255,.72)}
.modes button[aria-pressed="true"]{background:var(--pop);color:#16161A;font-weight:700}
.strip{background:var(--panel);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:rgba(255,255,255,.62)}
.strip b{color:var(--pop);font-weight:500}
.strip .in{max-width:1240px;margin:0 auto;display:flex;gap:16px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.strip .in>span{white-space:nowrap;flex:0 0 auto}
.strip .in::-webkit-scrollbar{display:none}
nav{background:var(--bg);border-bottom:2px solid var(--edge);position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);z-index:24}
nav .in{max-width:1240px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-block:9px;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--surface-2);border:2px solid transparent;border-radius:999px;color:var(--ink-2);font-family:var(--body);font-weight:600;font-size:12.5px;padding:6px 13px;white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
nav .mn{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-right:6px}

/* estructura */
.frame{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1000px){.frame{grid-template-columns:minmax(0,1fr) 316px;gap:26px}}
main{padding-block:22px 40px;min-width:0;max-width:72ch}
aside{display:none}
@media (min-width:1000px){aside{display:block;padding-block:22px 40px}}

/* piezas */
.eyebrow{font-family:var(--body);font-weight:700;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--qui);margin-bottom:8px}
h2.step{font-size:clamp(36px,7.5vw,58px);font-weight:900;line-height:.92}
.lede{font-size:18px;color:var(--ink-2);margin-top:11px;max-width:60ch}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);padding:17px 18px;margin-top:16px}
.card h3{font-size:23px;font-weight:800;margin-bottom:9px}
.sub{font-size:14.5px;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-3);margin-top:10px}
.mono{font-family:var(--mono)}
.todo{background:var(--hl-bg);border:2px solid var(--edge);border-radius:var(--r);padding:13px 15px;margin-top:16px;font-size:15px;color:var(--ink)}
.todo b.k{font-family:var(--body);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);opacity:.72;display:block;margin-bottom:4px}
.warnbox{background:var(--warn-bg);border:2px solid var(--edge);border-radius:var(--r);padding:13px 15px;margin-top:16px;font-size:14.5px;color:var(--ink)}
.tag{font-family:var(--body);font-weight:700;font-size:11.5px;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.tag.f{background:var(--fis-bg);color:var(--fis)}
.tag.q{background:var(--qui-bg);color:var(--qui)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.na{background:var(--sunk);color:var(--ink-2)}
.tag.hl{background:var(--hl-bg);color:var(--hl)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:999px;font-family:var(--body);font-size:13px;padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.hl{background:var(--pop);border-color:#16161A;color:#16161A}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.big{font-size:15px;padding:12px 22px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--surface-2);border:2px solid var(--edge);border-radius:var(--r-s);font-family:var(--body);font-size:15px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
label.fld{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* casos */
.case{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.case:first-of-type{border-top:0}
.case .txt{min-width:0;font-size:15px}
.pick{display:flex;gap:6px}
.pick button{font-family:var(--body);font-weight:600;font-size:12.5px;border:2px solid var(--edge);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 13px}
.pick button[aria-pressed="true"].f{background:var(--fis-bg);border-color:var(--fis);color:var(--fis);font-weight:600}
.pick button[aria-pressed="true"].q{background:var(--qui-bg);border-color:var(--qui);color:var(--qui);font-weight:600}

/* ficha de pesos */
.ficha{background:var(--surface-2);border:2px solid var(--edge);border-radius:var(--r-s);padding:13px;margin-top:12px;font-family:var(--mono);font-size:12.5px}
.ficha .row{display:grid;grid-template-columns:1fr auto 70px;gap:8px;align-items:center;padding:3px 0}
.bar{height:7px;border-radius:1px;background:var(--line);position:relative;overflow:hidden;width:90px}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar i.q{background:var(--qui)}
.bar i.f{background:var(--fis)}
.tot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
.unk{color:var(--ink-3);margin-top:8px;font-size:11.5px;word-break:break-word}
.kicker{color:var(--ink-3);font-size:10.5px;letter-spacing:.07em;margin-bottom:6px}

/* tablas y métricas */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:10.5px;letter-spacing:.04em}
td.lbl,th.lbl{text-align:left;background:var(--surface-2);color:var(--ink-2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-top:12px}
.metric{background:var(--surface-2);border:2px solid var(--edge);border-radius:var(--r-s);padding:12px}
.metric .n{font-family:var(--display);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-.03em}
.metric .k{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.metric.bad .n{color:var(--err)}
.metric.good .n{color:var(--ok)}

/* listas */
.limits{padding-left:19px;font-size:14.5px;color:var(--ink-2)}
.limits li{margin-bottom:7px}
ol.guide{counter-reset:g;list-style:none;padding:0;margin:0}
ol.guide li{counter-increment:g;display:grid;grid-template-columns:26px 1fr;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
ol.guide li:first-child{border-top:0;padding-top:2px}
ol.guide li::before{content:counter(g);font-family:var(--display);font-weight:900;font-size:30px;color:var(--qui);line-height:.9}
ol.guide h4{font-family:var(--display);font-size:21px;font-weight:800;margin-bottom:3px}
ol.guide p{font-size:14.5px;color:var(--ink-2)}
ol.guide .mins{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase}
.check{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14.5px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--hl);flex:0 0 auto}
.qbtn{display:block;width:100%;text-align:left;background:var(--surface-2);border:2px solid var(--edge);border-radius:var(--r-s);font-family:var(--body);font-weight:600;font-size:14.5px;padding:10px 13px;margin-top:8px}
.qbtn[aria-expanded="true"]{background:var(--hl-bg)}
.ans{font-size:14.5px;color:var(--ink-2);border-left:3px solid var(--qui);margin:0;padding:10px 13px}
.ans b{color:var(--ink)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-2);cursor:pointer}
details p,details li{font-size:14px;color:var(--ink-2);margin-top:8px}
pre.code{background:var(--panel);color:#EDEDEA;border:2px solid var(--edge);border-radius:var(--r-s);padding:14px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre;margin-top:11px}

/* diálogo */
.chat{display:flex;flex-direction:column;gap:9px;margin-top:12px;max-height:50vh;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:var(--r);font-size:15px}
.msg.t{background:var(--surface-2);border:2px solid var(--edge);border-bottom-left-radius:3px;align-self:flex-start}
.msg.u{background:var(--fis-bg);border:2px solid var(--edge);border-bottom-right-radius:3px;align-self:flex-end}
.msg .who{font-family:var(--body);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.cer{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.cer span{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--edge);border-radius:999px;padding:4px 11px;color:var(--ink-3)}
.cer span.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.cer span.now{background:var(--hl-bg);border-color:var(--hl);color:var(--hl);font-weight:600}
.lvl{display:flex;gap:3px;align-items:center;margin-top:9px}
.lvl i{width:16px;height:5px;border-radius:1px;background:var(--line);display:block}
.lvl i.on{background:var(--warn)}

/* bitácora */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.rail h3{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pop);font-weight:700;margin-bottom:11px}
.rail .box{background:var(--panel);color:var(--panel-ink);border:2px solid var(--edge);border-radius:var(--r);padding:15px 16px;margin-bottom:12px}
.rail .box .note{color:rgba(255,255,255,.58)}
.rail .box .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.kv{display:flex;justify-content:space-between;gap:9px;font-family:var(--mono);font-size:11.5px;padding:5px 0;border-top:1px solid rgba(255,255,255,.13)}
.kv:first-of-type{border-top:0}
.kv span:last-child{color:#fff;font-weight:500;text-align:right}
.kv span:first-child{color:rgba(255,255,255,.55)}
.flash{animation:fl .7s ease}
@keyframes fl{0%{background:var(--ok-bg)}100%{background:transparent}}
.sheetbtn{display:none}
@media (max-width:999px){
 .sheetbtn{display:flex;position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:26;align-items:center;gap:7px;background:var(--pop);color:#16161A;border:2px solid #16161A;border-radius:999px;padding:11px 18px;font-family:var(--body);font-weight:700;font-size:13px;box-shadow:0 5px 18px rgba(0,0,0,.25)}
 aside.open{display:block;position:fixed;inset:auto 0 0 0;z-index:27;background:var(--bg);border-top:2px solid var(--edge);border-radius:16px 16px 0 0;max-height:74vh;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
 aside.open .rail{position:static}
}
.foot{display:flex;justify-content:space-between;gap:10px;margin:26px 0 8px}
.sync{font-family:var(--body);font-weight:700;font-size:11.5px;padding:3px 10px;border-radius:999px}
.sync.on{background:var(--ok-bg);color:var(--ok)}
.sync.off{background:var(--sunk);color:var(--ink-2)}
.rail .box .sync.off{background:rgba(255,255,255,.14);color:#fff}
.sync.bad{background:var(--err-bg);color:var(--err)}
.likert{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.likert button{font-family:var(--body);font-weight:700;font-size:12.5px;border:2px solid var(--edge);background:var(--surface);border-radius:999px;width:36px;height:34px;color:var(--ink-2)}
.likert button.no{width:auto;padding:0 9px}
.likert button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.pitem{border-top:1px solid var(--line);padding:11px 0}
.pitem:first-of-type{border-top:0}
.pitem .lab{font-size:14.5px}
.pitem .tst{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.test{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.test:first-of-type{border-top:0}
.test .id{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
/* mecanismo visual */
.paso{border-top:2px solid var(--edge);padding-top:14px;margin-top:16px}
.paso:first-of-type{border-top:0;padding-top:0;margin-top:0}
.paso .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:900;font-size:17px;margin-right:9px;vertical-align:-5px}
.paso h4{display:inline;font-family:var(--display);font-size:22px;font-weight:800}
.paso .exp{font-size:14px;color:var(--ink-2);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{border:2px solid var(--edge);border-radius:999px;padding:5px 12px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2)}
.chip.q{background:var(--qui-bg);color:var(--qui)}
.chip.f{background:var(--fis-bg);color:var(--fis)}
.chip.off{background:transparent;color:var(--ink-3);border-style:dashed}
.chip.dim{opacity:.26}
.chip b{font-family:var(--mono);font-size:12.5px;font-weight:500}
.balanza{margin-top:13px}
.btrack{position:relative;height:44px;border:2px solid var(--edge);border-radius:999px;background:linear-gradient(90deg,var(--fis-bg) 0%,var(--surface-2) 44%,var(--surface-2) 56%,var(--qui-bg) 100%)}
.bzero{position:absolute;left:calc(50% - 1px);top:4px;bottom:4px;width:2px;background:var(--edge);opacity:.5}
.bneedle{position:absolute;top:3px;bottom:3px;width:10px;margin-left:-5px;border-radius:999px;background:var(--ink);transition:left .4s ease}
.blab{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;margin-top:7px}
.blab .l{color:var(--fis)}
.blab .r{color:var(--qui)}
.suma{font-family:var(--mono);font-size:14px;background:var(--surface-2);border:2px solid var(--edge);border-radius:var(--r-s);padding:12px;margin-top:11px;line-height:2.1;word-break:break-word}
.suma i{font-style:normal;padding:2px 6px;border-radius:5px}
.suma i.q{background:var(--qui-bg);color:var(--qui)}
.suma i.f{background:var(--fis-bg);color:var(--fis)}
.suma .eq{font-weight:600;border-top:1px solid var(--line);display:block;margin-top:7px;padding-top:7px}
.vered{font-family:var(--display);font-size:26px;font-weight:800;margin-top:12px;line-height:1.1}
/* pantalla de entrada */
.welcome{position:fixed;inset:0;z-index:35;overflow-y:auto;background:var(--bg);padding-bottom:40px}
.hero{background:var(--panel);color:#fff;position:relative;overflow:hidden;border-radius:0 0 26px 26px;
 padding:calc(34px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) 86px}
.hero::before{content:"";position:absolute;inset:0;opacity:.14;
 background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
 background-size:38px 38px;mask-image:radial-gradient(130% 90% at 70% 0%,#000 25%,transparent 72%)}
.heroin{position:relative;max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:center}
.hero .kick{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.92;letter-spacing:-.03em;margin:11px 0 14px;color:#fff}

<script>
"use strict";
/* ══════════════ 1. MODELO: Naive Bayes multinomial sobre bolsa de palabras ══════════════ */
const TRAIN_BASE=[
 {t:"se quema el pan en el horno y queda negro",y:"Q"},
 {t:"el aceite se pone rancio despues de varios meses",y:"Q"},
 {t:"la manzana cortada se oscurece al contacto con el aire",y:"Q"},
 {t:"el azucar se quema y se vuelve caramelo oscuro",y:"Q"},
 {t:"la leche se corta y se forman grumos solidos",y:"Q"},
 {t:"el cuchillo de acero se oxida y aparece una costra naranja",y:"Q"},
 {t:"la masa con levadura fermenta y libera gas",y:"Q"},
 {t:"el agua hierve en la olla y sale vapor",y:"F"},
 {t:"la mantequilla se derrite en la sarten caliente",y:"F"},
 {t:"la sal se disuelve en el agua",y:"F"},
 {t:"el agua se congela y se forma hielo",y:"F"},
 {t:"se corta la cebolla en trozos pequenos",y:"F"},
 {t:"el vapor se condensa en la tapa fria",y:"F"},
 {t:"se muele el cafe en granos hasta dejarlo en polvo",y:"F"}];
const STOP=new Set(["que","con","por","una","uno","del","las","los","para","como","mas","sus","sobre","hasta","otra","otro","muy","esta","este","son","desde","varios"]);
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const tok=s=>norm(s).replace(/[^a-zñ ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
let extra=[],M=null;
function train(){
 const data=TRAIN_BASE.concat(extra),cQ={},cF={},V=new Set();let NQ=0,NF=0,dQ=0,dF=0;
 data.forEach(d=>{const ts=tok(d.t);d.y==="Q"?dQ++:dF++;
  ts.forEach(w=>{V.add(w);if(d.y==="Q"){cQ[w]=(cQ[w]||0)+1;NQ++}else{cF[w]=(cF[w]||0)+1;NF++}})});
 const vs=V.size,w={};
 V.forEach(t=>{w[t]=Math.log(((cQ[t]||0)+1)/(NQ+vs))-Math.log(((cF[t]||0)+1)/(NF+vs))});
 M={w,prior:Math.log(dQ/dF),vs,n:data.length,dQ,dF};
}
function predict(text){
 const ts=tok(text);let s=M.prior;const used=[],unk=[];
 ts.forEach(t=>{if(M.w[t]!==undefined){s+=M.w[t];used.push({t,v:M.w[t]})}else if(!unk.includes(t))unk.push(t)});
 return{s,lab:s>0?"Q":"F",p:1/(1+Math.exp(-Math.abs(s))),used,unk,tie:Math.abs(s)<0.2};
}
train();

/* ══════════════ 2. CONTENIDO ══════════════ */
const CASES=[
 {id:"c1",t:"El pan tostado se enfría sobre la rejilla.",ref:"F",why:"Enfriarse es un cambio de temperatura: la materia es la misma antes y después."},
 {id:"c2",t:"La clara de huevo se vuelve blanca y firme en la sartén.",ref:"Q",why:"Las proteínas se desnaturalizan y se forman enlaces nuevos; el proceso no se revierte enfriando."},
 {id:"c3",t:"El azúcar se disuelve en el té caliente.",ref:"F",why:"La sacarosa se dispersa entre las moléculas de agua y sigue siendo sacarosa; se recupera al evaporar el agua."},
 {id:"c4",t:"El cuchillo mojado queda con una costra naranja después de una semana.",ref:"Q",why:"El hierro reacciona con oxígeno y agua; el óxido es una sustancia distinta del acero."},
 {id:"c5",t:"Se derrite el queso sobre la pizza y los bordes se queman.",ref:"M",why:"Ocurren los dos a la vez: fusión (físico) y combustión incompleta en el borde (químico)."},
 {id:"c6",t:"La sal se disuelve en el agua de la olla.",ref:"F",why:"Los iones se separan y se hidratan, pero no se forma una sustancia nueva."},
 {id:"c7",t:"El jugo de limón hace que la leche forme grumos.",ref:"Q",why:"El ácido baja el pH y la caseína precipita; cambia la sustancia, no sólo su estado."},
 {id:"c8",t:"El hielo del congelador se achica después de un mes.",ref:"F",why:"Sublimación: el hielo pasa a vapor sin derretirse. Sigue siendo agua."}];
const REFNAME={F:"Físico",Q:"Químico",M:"Los dos"};
const META=[
 {q:"¿Cómo armaste esta respuesta?",a:"Separo el texto en palabras, busco cada palabra en una tabla de pesos y sumo los pesos. Si la suma queda sobre cero, entrego la etiqueta <b>químico</b>; si queda bajo cero, <b>físico</b>. No hay otro paso. El orden de las palabras no se usa."},
 {q:"¿De dónde salen esos pesos?",a:"De contar en cuántos ejemplos de cada clase aparece cada palabra, dentro de una base de 14 frases escritas por tu profesora. Una palabra que aparece sólo en frases etiquetadas como químicas recibe peso positivo. Puedes abrir la base completa en la fase 2 y agregarle ejemplos."},
 {q:"¿Qué pasa con una palabra que no está en tu tabla?",a:"Suma cero. El texto igual recibe una etiqueta, calculada sólo con las palabras que sí están en la tabla. En la fase 2 aparecen listadas como <b>palabras fuera del vocabulario</b>."},
 {q:"¿Qué significa el porcentaje que muestras?",a:"Es el resultado de aplicar una fórmula a la suma de pesos: mide cuán lejos quedó esa suma del empate. <b>No mide si la etiqueta es correcta.</b> Con una base de 14 frases, un 95% puede acompañar una respuesta equivocada, y así ocurre en este banco de prueba."},
 {q:"¿Puedes entregar una respuesta falsa?",a:"Sí. Siempre entrego una de dos etiquetas, incluso cuando ninguna palabra del texto está en mi tabla y la suma vale cero. Comparar mi salida con una fuente revisada es parte del trabajo de quien pregunta, no mío."},
 {q:"¿Qué pasa si escribo una negación?",a:"Nada. <b>No se quema</b> y <b>se quema</b> comparten las mismas palabras con peso, así que la suma es idéntica. Pruébalo con el botón que está más abajo."},
 {q:"¿En qué te pareces a los chatbots que uso en el celular?",a:"Comparten una cosa: los números de ambos se ajustan a partir de ejemplos. Las diferencias son grandes. Yo uso 14 frases y una tabla que cabe en una pantalla; un sistema de chat ajusta miles de millones de números y produce texto en vez de dos etiquetas. Y ninguno de los dos consulta una fuente mientras responde, salvo que tenga conectada una herramienta de búsqueda que entregue el link."}];
const LIMITS=[
 "No contiene química: no hay enlaces, ni átomos, ni reacciones dentro del programa. Sólo palabras y números.",
 "No tiene la categoría <b>los dos a la vez</b>. Frente a un caso mixto entrega igual una de las dos etiquetas.",
 "No usa el orden de las palabras ni las negaciones.",
 "No distingue entre palabras parecidas: <b>congela</b> y <b>congelador</b> son dos entradas sin relación.",
 "No busca en internet, no tiene fuentes, no entrega links ni DOI. Lo que dice no viene de ninguna parte verificable: viene de 14 frases.",
 "No explica <b>por qué</b> un cambio es físico o químico. Esa explicación la tiene que poner una persona."];
const CRIT=["Entrega una fuente que se puede abrir (link, libro, DOI).","Puedo repetir la observación y obtener lo mismo.","Coincide con lo que dice el texto de la asignatura.","Distingue entre lo que observo y lo que interpreto.","Dice qué parte de la respuesta no está respaldada.","Se banca una pregunta de seguimiento sin cambiar la respuesta."];
const STARTERS=["¿Qué pasaría con las respuestas si…","¿Cuántos ejemplos harían falta para que…","¿Cómo podría comprobar en el laboratorio que…","¿Qué criterio me permitiría decidir si…"];

/* ══════════════ 3. TUTOR CER: motor de andamiaje ══════════════ */
const OBS=["color","olor","burbuj","humo","gas","vapor","temperatura","calor","caliente","frio","textura","solido","liquido","grumo","costra","ceniza","negro","naranja","blanca","blanco","firme","espuma","llama","achica","desaparece","derrite","disuelve","oxida","quema","hierve","congela","evapora","duro","blando","peso","masa","sabor"];
const RAZ=["sustancia nueva","nueva sustancia","sustancia distinta","otra sustancia","sustancias nuevas","misma sustancia","sigue siendo","se forma","no se forma","se puede recuperar","no se puede recuperar","cambio de estado","cambia de estado","reaccion","reacciona","se combina","composicion"];
const CLAIM=[["Q",["quimico","quimica"]],["F",["fisico","fisica"]],["M",["los dos","ambos","mixto","las dos"]]];
const CONCEP=[
 {id:"color",pat:["cambia de color","cambio de color","cambia el color","se puso de otro color","porque es de otro color"],name:"el color decide",
  reply:"El color es una pista, no un criterio. Al agua con colorante le cambia el color y sigue siendo agua con colorante: no apareció ninguna sustancia nueva. ¿Qué otra cosa observaste además del color?"},
 {id:"revert",pat:["se puede volver","es reversible","se puede devolver","vuelve a ser","no se puede volver","irreversible","no tiene vuelta"],name:"la reversibilidad decide",
  reply:"Cuidado con ese criterio. Romper una hoja de papel no se puede deshacer y sigue siendo un cambio físico: los pedazos son papel. Lo que decide es si al final hay una sustancia distinta, no si se puede volver atrás. En tu caso, ¿al final hay la misma sustancia o una distinta?"},
 {id:"calor",pat:["porque hay calor","porque se calienta","porque esta caliente","porque le ponen calor","el calor siempre"],name:"el calor decide",
  reply:"Calentar algo no lo vuelve químico por sí solo: el agua caliente sigue siendo agua. El calor a veces provoca una reacción y a veces sólo sube la temperatura. ¿Cómo distinguirías esos dos casos mirando lo que queda al final?"},
 {id:"disol",pat:["disolver es quimico","disolverse es quimico","se disuelve entonces es quimico","al disolverse se transforma","se disuelve asi que es quimico"],name:"disolver es químico",
  reply:"Prueba este contraejemplo: si dejas evaporar el agua con sal, la sal vuelve a aparecer. Nunca dejó de ser sal. ¿Eso te hace cambiar tu afirmación o la mantienes?"},
 {id:"estado",pat:["cambia de estado entonces es quimico","hervir es quimico","derretir es quimico","de liquido a gas es quimico"],name:"cambio de estado es químico",
  reply:"Hielo, agua líquida y vapor son la misma sustancia en tres estados distintos. ¿Qué tendría que pasar, además del cambio de estado, para hablar de cambio químico?"},
 {id:"burbuja",pat:["porque hace burbujas","hay burbujas entonces","burbujas es quimico","tiene burbujas asi que"],name:"las burbujas deciden",
  reply:"El agua hirviendo hace burbujas, y esas burbujas son vapor de agua: la misma sustancia. Las burbujas importan cuando el gas es distinto de lo que había antes. ¿De qué serían las burbujas en tu caso?"}];
const ASKANS=["dame la respuesta","dime la respuesta","cual es la respuesta","solo dime","respuesta correcta","dimelo","cual es","no me preguntes","dame el resultado"];
const OFFTOPIC=["capital de","quien gano","pelicula","presidente","futbol","novia","chiste","clave del wifi","tarea de historia","resumen del libro"];
const has=(t,arr)=>arr.some(p=>norm(t).includes(p));
const HINTS={
 claim:["Partamos por tu posición. ¿Dirías que es un cambio físico, uno químico, o los dos a la vez?",
        "Necesito una afirmación tuya antes de seguir. Elige una: físico, químico o los dos.",
        "Escribe sólo una palabra: <b>físico</b>, <b>químico</b> o <b>los dos</b>. Después te pido lo demás."],
 ev:["Ahora la evidencia: ¿qué se puede <b>observar</b> en ese caso? Algo que se vea, se huela, se toque o se mida.",
     "Todavía no me diste algo observable. Por ejemplo: cambios de color, olor, burbujas, temperatura, textura o estado.",
     "Dime una sola observación concreta de ese caso, aunque sea obvia. Lo que aparece, lo que desaparece o lo que queda distinto."],
 raz:["Falta el razonamiento: ¿esa observación indica que hay una <b>sustancia nueva</b>, o que es la misma sustancia con otra forma?",
      "Conecta tu evidencia con el criterio del curso. La pregunta es si lo que queda al final es la misma sustancia o una distinta.",
      "Completa esta frase con tus palabras: «esto indica que al final hay __________ porque __________»."]};
function newDlg(caseId){return{caseId,stage:0,level:1,asked:0,flags:[],claim:"",turns:[{r:"t",m:"Trabajemos un caso. Te voy a pedir tres cosas en este orden: tu <b>afirmación</b>, una <b>evidencia</b> observable y tu <b>razonamiento</b>. No te voy a dar la respuesta antes de eso.<br><br>Caso: <b>"+CASES.find(c=>c.id===caseId).t+"</b><br><br>¿Es un cambio físico, químico o los dos?"}]}}
function tutorTurn(d,text){
 const c=CASES.find(x=>x.id===d.caseId),out=[];
 if(has(text,OFFTOPIC)){out.push("Eso queda fuera de lo mío: sólo trabajo cambios físicos y químicos en situaciones de cocina. Volvamos al caso. "+HINTS[["claim","ev","raz"][Math.min(d.stage,2)]][0]);return out}
 const con=CONCEP.find(k=>has(text,k.pat));
 if(con&&!d.flags.includes(con.id)){d.flags.push(con.id);d.level=Math.min(5,d.level+1);out.push(con.reply);return out}
 if(has(text,ASKANS)){
  d.asked++;
  if(d.asked>=3){d.stage=3;out.push("Te la voy a dar, pero dejo constancia de que la pediste sin completar el ciclo.<br><br>Referencia revisada: <b>"+REFNAME[c.ref]+"</b>. "+c.why+"<br><br>Ahora sí una pregunta para ti: ¿qué observación habrías necesitado para llegar sola o solo a eso?");return out}
  out.push("No te la voy a dar todavía. "+(d.asked===1?"Primero tu posición, aunque te equivoques: equivocarse aquí no cuesta nada.":"Segunda vez que me la pides. Te doy una pista en vez de la respuesta: fíjate en qué queda al final del proceso y si eso es lo mismo que había al principio.")+"<br><br>"+HINTS[["claim","ev","raz"][Math.min(d.stage,2)]][Math.min(d.level-1,2)]);
  return out}
 if(d.stage===0){
  const hit=CLAIM.find(([,pats])=>has(text,pats));
  if(!hit){d.level=Math.min(5,d.level+1);out.push(HINTS.claim[Math.min(d.level-1,2)]);return out}
  d.claim=hit[0];d.stage=1;
  out.push("Anotado: dices <b>"+REFNAME[d.claim].toLowerCase()+"</b>. No te voy a decir si está bien todavía.<br><br>"+HINTS.ev[0]);
  return out}
 if(d.stage===1){
  if(!has(text,OBS)){d.level=Math.min(5,d.level+1);out.push(HINTS.ev[Math.min(d.level-1,2)]);return out}
  d.stage=2;out.push("Esa sí es una observación. "+HINTS.raz[0]);return out}
 if(d.stage===2){
  if(!has(text,RAZ)){d.level=Math.min(5,d.level+1);out.push(HINTS.raz[Math.min(d.level-1,2)]);return out}
  d.stage=3;
  const acierta=d.claim===c.ref;
  const nueva=has(text,["sustancia nueva","nueva sustancia","sustancia distinta","otra sustancia","sustancias nuevas","no es la misma"]);
  const misma=has(text,["misma sustancia","sigue siendo"]);
  if((d.claim==="F"&&nueva&&!misma)||(d.claim==="Q"&&misma&&!nueva)){
   d.incoherente=true;
   out.push("Antes de la referencia, mira tu propio argumento: afirmaste <b>"+REFNAME[d.claim].toLowerCase()+"</b> y tu razonamiento dice que al final hay <b>"+(nueva?"una sustancia distinta":"la misma sustancia")+"</b>. Esas dos cosas no calzan entre sí.");
  }
  out.push("Ciclo completo: afirmación, evidencia y razonamiento.<br><br>Referencia revisada por tu profesora: <b>"+REFNAME[c.ref]+"</b>. "+c.why+
   "<br><br>"+(acierta?"Tu afirmación coincide. Lo que vale no es que coincida, sino que ahora puedes decir en qué te apoyaste.":"Tu afirmación no coincide, y eso no invalida tu razonamiento: revisa cuál de los dos pasos falló, la observación o la conexión con el criterio.")+
   "<br><br>Para cerrar: ¿qué dato tendrías que buscar para estar segura o seguro, sin preguntarle a nadie?");
  return out}
 out.push("Ese caso ya lo cerramos. Puedes elegir otro arriba o escribir tu pregunta de cierre en la fase final.");
 return out;
}

/* ══════════════ 4. SYSTEM PROMPT documentado ══════════════ */
const SYSTEM_PROMPT=`### 1 · ROL Y PERSONALIDAD
Eres «Cocina CC-1», tutor de ciencias naturales para estudiantes de 8.º básico (13-14 años) en Chile.
Dominio único: distinción entre cambio físico y cambio químico en situaciones de cocina doméstica.
Registro: cercano, breve, en segunda persona singular, español de Chile, sin diminutivos ni emojis.
NO eres un buscador ni un resolvedor de tareas. Eres un interlocutor que exige argumentos.

### 2 · OBJETIVO DIDÁCTICO
Que el estudiante construya y defienda una explicación propia usando el criterio nuclear:
hay cambio químico cuando al final del proceso existe al menos una SUSTANCIA DISTINTA de las iniciales.
Razonamiento a desarrollar: pasar de indicios perceptivos sueltos (color, burbujas, calor)
a un criterio de identidad de la sustancia, y reconocer cuándo un indicio no es concluyente.

### 3 · REGLAS DE INTERACCIÓN
<regla_1> Nunca entregues la clasificación de un caso antes de que el estudiante haya producido,
en este orden: (a) una AFIRMACIÓN, (b) una EVIDENCIA observable, (c) un RAZONAMIENTO que conecte ambas. </regla_1>
<regla_2> Si pide la respuesta directa, niégala y devuelve una pregunta o una pista.
A la tercera petición explícita, entrégala, declara que se entregó sin completar el ciclo y pide
al estudiante reconstruir qué le faltaba. </regla_2>
<regla_3> Una respuesta por turno y una sola pregunta por turno. Máximo 80 palabras. </regla_3>
<regla_4> Ante una concepción alternativa catalogada (el color decide / la reversibilidad decide /
el calor decide / disolver es químico / cambio de estado es químico / las burbujas deciden),
responde con un CONTRAEJEMPLO concreto y verificable, nunca con una corrección frontal. </regla_4>
<regla_5> Escala el andamiaje en 5 niveles. Nivel 1: pregunta abierta. Nivel 5: frase incompleta

### 4 · EJEMPLOS (FEW-SHOT)

### 5 · RESTRICCIONES Y SEGURIDAD
- Dominio cerrado: fuera de cambio físico/químico en cocina, declina y reencauza en una línea.
- Sin datos personales: no pidas nombre, curso, correo, edad ni ubicación. Si el estudiante los

- Sin juicios sobre la persona: se evalúa el argumento, nunca la capacidad.

function toFire(v){
 if(v===null||v===undefined)return{nullValue:null};
 if(typeof v==="string")return{stringValue:v};
 if(typeof v==="boolean")return{booleanValue:v};
 if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
 if(Array.isArray(v))return{arrayValue:{values:v.map(toFire)}};
 const f={};Object.keys(v).forEach(k=>f[k]=toFire(v[k]));return{mapValue:{fields:f}};
}
function fromFire(v){
 if(!v)return null;
 if("stringValue"in v)return v.stringValue;
 if("integerValue"in v)return Number(v.integerValue);
 if("doubleValue"in v)return Number(v.doubleValue);
 if("booleanValue"in v)return v.booleanValue;
 if("nullValue"in v)return null;
 if("arrayValue"in v)return(v.arrayValue.values||[]).map(fromFire);
 if("mapValue"in v){const o={},f=v.mapValue.fields||{};Object.keys(f).forEach(k=>o[k]=fromFire(f[k]));return o}
 return null;
}

async function pedirIA(prompt){
 const a=EFFAI();
 let r;
 try{r=await fetch(a.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,model:a.model})})}
 catch(e){throw new Error("el navegador bloqueó la llamada antes de llegar al Worker. Abre "+a.url+" en una pestaña: si no responde un JSON con ok:true, el código del Worker no está desplegado; si responde, el problema es ALLOWED_ORIGINS")}
 const j=await r.json().catch(()=>null);
 if(!r.ok)throw new Error((j&&j.error)||(r.status+" del Worker"));
 return (j&&j.text)||"Respuesta vacía.";
}

 '<p class="vered">'+(lento?'Va '+paso+' de '+total+' palabras: por ahora iría <b style="color:var(--'+(vis>0?"qui":"fis")+')">'+lab+'</b>.'

 return '<div class="eyebrow">Funcionalidad y validación · criterio 3</div><h2 class="step">Banco de pruebas</h2>'+
 '<p class="lede">Once casos ejecutables sobre el motor real: seis sobre el comportamiento del tutor, tres sobre el clasificador, uno sobre reentrenamiento y uno sobre privacidad del envío.</p>'+
 '<div class="card"><div class="btnrow"><button class="btn" id="runtests">Ejecutar las 11 pruebas</button>'+
 (R?'<button class="btn ghost" id="copytests">Copiar resultados</button><span class="tag '+(R.every(x=>x.ok)?"ok":"err")+'">'+R.filter(x=>x.ok).length+' de '+R.length+' aprobadas</span>':"")+'</div>'+
 (R?R.map(t=>'<div class="test"><span class="id">'+t.id+'</span><div><b>'+esc(t.n)+'</b><div class="note" style="margin-top:3px"><b>Esperado:</b> '+esc(t.esp)+'</div>'+
  '<div class="note" style="margin-top:3px"><b>Obtenido:</b> '+esc(String(t.got).replace(/<[^>]+>/g," ").slice(0,220))+'</div></div>'+
  '<span class="tag '+(t.ok?"ok":"err")+'">'+(t.ok?"aprueba":"falla")+'</span></div>').join(""):'<p class="sub" style="margin-top:12px">Sin ejecutar todavía.</p>')+'</div>'+
 '<div class="card"><h3>Resultados conceptuales del clasificador</h3><p class="sub">Medición sobre los 8 casos del banco, con la base de '+M.n+' ejemplos cargada ahora.</p>'+
 '<div class="scroll"><table><tr><th class="lbl">Caso</th><th>Referencia</th><th>Modelo</th><th>Confianza</th><th>Resultado</th></tr>'+
 CASES.map(c=>{const r=predict(c.t),ok=c.ref!=="M"&&r.lab===c.ref;
  return '<tr><td class="lbl" style="font-size:11.5px">'+esc(c.t.slice(0,46))+'…</td><td>'+REFNAME[c.ref]+'</td><td>'+REFNAME[r.lab]+'</td><td>'+(r.p*100).toFixed(0)+'%</td><td><span class="tag '+(c.ref==="M"?"na":ok?"ok":"err")+'">'+(c.ref==="M"?"sin categoría":ok?"coincide":"error")+'</span></td></tr>'}).join("")+'</table></div>'+
 '<p class="note">Los errores son deliberados y diagnosticables: provienen de palabras sin contenido químico (<b>pan</b>, <b>sartén</b>) que cargan peso por aparecer en un ejemplo de ese lado.</p></div>';
}

 '<div class="card"><p class="sub">Escala: 1 muy insuficiente · 2 insuficiente · 3 aceptable · 4 bueno · 5 excelente. <b>NO</b> no promedia.</p>'+

 PEER.map(d=>'<div class="card"><h3>'+esc(d.t)+'</h3>'+d.items.map(([id,lab,tst])=>

 '<div><label class="fld">Gravedad</label><select id="ssev"><option value="">—</option>'+Object.entries(SEV).map(([k,v])=>'<option value="'+k+'"'+(S.peer.sug.sev===k?" selected":"")+'>'+k+' · '+v+'</option>').join("")+'</select></div></div>'+

function dEtica(){
 return '<div class="eyebrow">Ética, sesgos y límites · criterio 4</div><h2 class="step">Qué puede ir mal</h2>'+
 '<div class="card"><h3>1. Errores y alucinaciones</h3>'+
 '<p class="sub">El clasificador <b>siempre</b> entrega una etiqueta, incluso con suma cero. No tiene estado «no sé». Dos de los ocho casos del banco salen equivocados con confianza sobre 65%, y uno no cabe en ninguna de sus dos categorías.</p>'+
 '<p class="sub" style="margin-top:8px">El tutor conversacional, en modo local, no puede alucinar contenido: sus respuestas son plantillas fijas y los contraejemplos están escritos y revisados. En modo con modelo de lenguaje conectado sí puede, y por eso el prompt incluye la regla 7 y el banco de pruebas se vuelve obligatorio antes de cada aplicación.</p>'+
 '<p class="note"><b>Qué hace el/la docente:</b> la fase 4 ya obliga a contrastar con la referencia revisada. Si aparece una afirmación química incorrecta, se detiene la actividad, se escribe en la pizarra y se usa como caso de análisis.</p></div>'+
 '<div class="card"><h3>2. Sesgo del conjunto de entrenamiento</h3>'+
 '<p class="sub">Catorce frases escritas por una sola persona, en un solo registro, sobre una sola cocina. Palabras como <b>pan</b> o <b>sartén</b> quedan asociadas a una clase sin tener ninguna relación con ella. Es el mecanismo de sesgo por muestra pequeña y no balanceada, visible aquí a escala de una tabla.</p>'+
 '<p class="note"><b>Qué hace el/la docente:</b> pedir que el curso agregue ejemplos y vuelva a medir. El sesgo deja de ser una palabra y pasa a ser un número que cambia.</p></div>'+
 '<div class="card"><h3>3. Límites de dominio</h3>'+
 '<p class="sub">Fuera de cambio físico y químico en cocina, el tutor declina. No responde tareas, no opina y no entrega fuentes bibliográficas porque no las tiene. Declararlo evita el uso más probable en un curso: pedirle que haga la tarea.</p></div>'+
 '<div class="card"><h3>4. Privacidad</h3>'+
 '<p class="sub">No se pide nombre, curso, correo ni edad en ninguna pantalla. El identificador es un código aleatorio de cuatro caracteres generado en el navegador (<b class="mono">'+esc(S.code)+'</b>) que no permite volver a la persona. El envío al piloto es voluntario y se dispara con un botón, nunca en segundo plano.</p>'+
 '<p class="sub" style="margin-top:8px">Qué viaja: marcas de clasificación, métricas, etapa del diálogo, concepciones detectadas, puntajes de coevaluación y, si el docente lo habilita, los textos abiertos. La prueba T11 del banco verifica que el envío no contenga campos identificatorios.</p>'+
 '<p class="note"><b>Qué hace el/la docente:</b> si el pilotaje es con menores, informar al establecimiento, usar la opción de desactivar textos abiertos y fijar una fecha de borrado de la colección.</p></div>'+
 '<div class="card"><h3>5. Consecuencias educativas</h3>'+
 '<p class="sub">El riesgo central no es técnico: es que el curso concluya «la IA es mala». Este recurso falla por razones que se señalan con el dedo sobre una tabla y mejora cuando el estudiante le agrega ejemplos. La conclusión buscada no es sobre la bondad de la herramienta sino sobre qué le exigimos a una fuente.</p>'+
 '<p class="sub" style="margin-top:8px">Riesgo secundario: leer el porcentaje de confianza como porcentaje de acierto. Los dos errores del banco salen con confianza alta justamente para que esa lectura se rompa en clase.</p>'+
 '<p class="note"><b>Qué hace el/la docente:</b> cerrar con la pregunta del guion: ¿preferirías un programa que se equivoca mucho avisando, o uno que se equivoca poco con 95% de confianza?</p></div>'+
 '<details><summary>Guion de la sesión, minuto a minuto</summary>'+
 '<p><b>Antes.</b> Proyectar «Cómo se usa» y leerla en voz alta. Elegir la ruta de 20 o 30 minutos.</p>'+
 '<p><b>0–4.</b> Clasificación individual sin ver el programa. Registrar en la pizarra cuántos marcaron la clara de huevo como físico: esa concepción reaparece después en la máquina.</p>'+
 '<p><b>4–9.</b> Fase 2 en proyector. El momento clave es el peso de <b>pan</b> y <b>sartén</b>. Pedir que alguien escriba una frase que lo haga fallar a propósito.</p>'+
 '<p><b>9–13.</b> Interrogación y prueba de la negación.</p>'+
 '<p><b>13–18.</b> Medición. Mostrar primero el porcentaje y después el tipo de error.</p>'+
 '<p><b>18–25.</b> Diálogo CER en parejas, un caso por pareja. Recoger qué concepciones aparecieron.</p>'+
 '<p><b>Cierre.</b> Veredicto, criterios y pregunta investigable. Se recogen las fichas.</p>'+
 '<p><b>Si se cae internet:</b> la actividad completa sigue funcionando. Sólo el envío al piloto y el análisis con modelo quedan fuera.</p></details>';
}
function dDatos(){

 return '<div class="eyebrow">Pilotaje</div><h2 class="step">Datos y Firebase</h2>'+
 '<p class="lede">La recolección usa Firestore por API REST: sin SDK, sin cuentas y sin dependencias. Pega aquí los datos de tu proyecto y el aplicativo queda listo para recibir respuestas de quienes lo pilotean.</p>'+
 '<div class="warnbox">Las llamadas externas están bloqueadas dentro de las vistas previas incrustadas. Para que el envío funcione, publica este archivo en tu propio sitio, por ejemplo en GitHub Pages.</div>'+
 '<div class="card"><h3>Proyecto conectado</h3>'+
 '<p class="sub">Viene fijado en el archivo, igual que el Worker. Quien use el aplicativo envía y lee sin configurar nada y sin ver credenciales.</p>'+
 '<div class="ficha">'+
 '<div class="row" style="grid-template-columns:78px 1fr"><span>proyecto</span><span style="text-align:left">'+(EFF().pid?esc(EFF().pid):"no definido")+'</span></div>'+

 '<div class="row" style="grid-template-columns:78px 1fr"><span>clave web</span><span style="text-align:left">'+(EFF().key?esc(EFF().key.slice(0,10))+"…":"no definida")+'</span></div>'+
 (CFG.pid||CFG.key||CFG.coll?'<div class="row" style="grid-template-columns:78px 1fr"><span>aviso</span><span style="text-align:left;color:var(--warn)">hay un ajuste temporal activo en este navegador</span></div>':"")+
 '</div>'+
 '<div class="btnrow"><span class="sync '+(cfgOk()?"on":"off")+'">'+(cfgOk()?"fijado en el archivo":"sin configurar")+'</span></div>'+
 '<p class="note">Para cambiar de proyecto se edita la constante <b class="mono">FIRE</b> al inicio del archivo. La clave web de Firebase no es un secreto: identifica el proyecto, y lo que protege los datos son las reglas de más abajo.</p>'+
 '<div style="margin-top:14px"><label class="fld">Textos abiertos de los participantes</label>'+
 '<div class="btnrow" style="margin-top:4px"><button class="btn'+(CFG.texts?"":" ghost")+'" data-texts="1">incluir</button><button class="btn'+(CFG.texts?" ghost":"")+'" data-texts="0">omitir</button></div>'+

 '<div class="grid2" style="margin-top:10px">'+
 '<div><label class="fld">Project ID</label><input type="text" id="cfg-pid" value="'+esc(CFG.pid)+'" placeholder="'+esc(FIRE.pid||"mi-proyecto")+'"></div>'+
 '<div><label class="fld">Web API key</label><input type="password" id="cfg-key" value="'+esc(CFG.key)+'" placeholder="AIza…"></div>'+
 '<div><label class="fld">Colección</label><input type="text" id="cfg-coll" value="'+esc(CFG.coll)+'" placeholder="'+esc(FIRE.coll)+'"></div></div>'+
 '<div class="btnrow"><button class="btn ghost" id="savecfg">Aplicar aquí</button>'+(CFG.pid||CFG.key||CFG.coll?'<button class="btn ghost" id="clearcfg">Volver a lo del archivo</button>':"")+'</div>'+
 '<pre class="code">const FIRE={pid:"'+esc(EFF().pid)+'", key:"'+esc(EFF().key)+'", coll:"'+esc(EFF().coll)+'"};</pre>'+

function poolResults(){
 return '<div class="card"><h3>Respuestas recibidas</h3><div class="btnrow"><button class="btn" id="loadpool">Cargar respuestas</button>'+
 (POOL.length?'<button class="btn ghost" id="copycsv">Copiar como CSV</button>':"")+'<span class="note" style="margin:0">'+esc(poolMsg)+'</span></div>'+
 (POOL.length?(()=>{const a=aggregate();
  return '<div class="metrics"><div class="metric"><div class="n">'+a.n+'</div><div class="k">sesiones</div></div>'+
  '<div class="metric"><div class="n">'+(a.exactitud===null?"–":a.exactitud.toFixed(0)+"%")+'</div><div class="k">exactitud media medida</div></div>'+
  '<div class="metric"><div class="n">'+a.etapa3+'</div><div class="k">ciclos CER completos</div></div>'+
  '<div class="metric"><div class="n">'+(a.nivel===null?"–":a.nivel.toFixed(1))+'</div><div class="k">andamiaje medio /5</div></div></div>'+
  '<h3 style="margin-top:16px">Dónde difieren de la referencia</h3><div class="scroll"><table><tr><th class="lbl">Caso</th><th>Ref.</th><th>físico</th><th>químico</th><th>difieren</th></tr>'+
  a.porCaso.map(c=>'<tr><td class="lbl" style="font-size:11.5px">'+esc(c.caso.slice(0,40))+'…</td><td>'+c.ref+'</td><td>'+c.f+'</td><td>'+c.q+'</td><td><b>'+c.difiere+'</b></td></tr>').join("")+'</table></div>'+
  '<h3 style="margin-top:16px">Coevaluación: medias por criterio</h3><div class="scroll"><table><tr><th class="lbl">Criterio</th><th>Media /5</th><th>n</th></tr>'+
  PEER.flatMap(d=>d.items.map(([id,lab])=>{const p=a.peer[id];const low=p.avg!==null&&p.avg<3.5;
   return '<tr><td class="lbl" style="font-size:11.5px">'+id+' · '+esc(lab.slice(0,52))+'…</td><td'+(low?' style="color:var(--err);font-weight:600"':"")+'>'+(p.avg===null?"–":p.avg.toFixed(2))+'</td><td>'+p.n+'</td></tr>'})).join("")+'</table></div>'+
  (a.sug.length?'<h3 style="margin-top:16px">Sugerencias recibidas</h3>'+a.sug.map(s=>'<div class="pitem"><span class="tag '+(s.sev==="P1"?"err":s.sev==="P2"?"na":"hl")+'">'+esc(s.sev)+'</span> '+esc(s.t)+(s.ev?'<div class="note">Evidencia: '+esc(s.ev)+'</div>':"")+'</div>').join(""):"")})():"")+'</div>';
}

/* ---- bitácora ---- */
function rail(){
 const m=metrics(),d=S.dlg,steps=EST();
 const avance=S.area==="pro"?"—":(S.step+"/"+(steps.length-1));

 return '<div class="box"><h3>Bitácora viva</h3>'+
  kv("código",'<span class="mono">'+esc(S.code)+'</span>')+
  kv("ruta",S.route+" min")+
  kv("avance",avance)+
  kv("marcaste",Object.keys(S.mine).length+" de 8")+
  kv("mis aciertos",m.misAciertos===null?"—":m.misAciertos+"%")+
  kv("modelo",m.exactitud===null?"sin medir":m.exactitud+"%")+
  kv("base",M.n+" ejemplos")+
  kv("preguntas abiertas",S.meta.length+" de 7")+
  (d?kv("diálogo CER",["afirmación","evidencia","razonamiento","cerrado"][d.stage]):"")+
  (d?kv("andamiaje","nivel "+d.level+"/5"):"")+
  kv("criterios",S.crit.length+" de 6")+
  kv("veredicto",S.veredicto?esc(S.veredicto):"—")+

  '</div>'+

  '<div class="btnrow" style="margin:0"><span class="sync '+(cfgOk()?(S.sent?"on":"off"):"off")+'">'+(cfgOk()?(S.sent?"enviado "+S.sent:"listo para enviar"):"no configurado")+'</span></div>'+

  '</div>';
}

/* ---- motor de render ---- */
const EL=id=>document.getElementById(id);
function render(){
 if(ROLE==="est")S.area="est";
 const pro=PRO(),steps=S.area==="pro"?pro:EST();
 if(S.area!=="pro"&&S.step>steps.length-1)S.step=steps.length-1;
 if(S.area==="pro"&&S.dstep>pro.length-1)S.dstep=0;
 const cur=S.area==="pro"?S.dstep:S.step;
 EL("welcome").hidden=!entrada;
 EL("gate").hidden=!gate;
 if(entrada){gate=false;EL("gate").hidden=true;EL("welcome").innerHTML=vistaEntrada();EL("sheet").hidden=true;save();return}
 EL("sheet").hidden=false;
 EL("roles").innerHTML=rolesBar();
 EL("nav").innerHTML=steps.map((s,i)=>'<button data-step="'+i+'" aria-current="'+(i===cur)+'"><span class="mn">'+s.n+'</span>'+s.k+'</button>').join("");
 const m=metrics();
 EL("strip").innerHTML=['base <b>'+M.n+'</b> ejemplos','vocabulario <b>'+M.vs+'</b> palabras',
  'exactitud <b>'+(m.exactitud===null?"sin medir":m.exactitud+"%")+'</b>',
  'tus marcas <b>'+Object.keys(S.mine).length+'/8</b>',
  'diálogo <b>'+(S.dlg?["afirmación","evidencia","razonamiento","cerrado"][S.dlg.stage]:"sin iniciar")+'</b>',
  'piloto <b>'+(cfgOk()?(S.sent?"enviado":"activo"):"local")+'</b>',
  'perfil <b>'+ROLENAME[ROLE]+'</b>'].map(x=>'<span>'+x+'</span>').join("");
 let body;
 if(S.area==="pro"){
  body=pro[S.dstep].f();
 }else{
  const seq=S.route===30?[sGuia,sClasifica,sMecanismo,sInterroga,sMide,sDialoga,sVeredicto]:[sGuia,sClasifica,sMecanismo,sInterroga,sMide,sVeredicto];
  body=seq[S.step]()+foot(seq.length-1);
 }
 EL("main").innerHTML=body;
 EL("railin").innerHTML=rail();
 EL("sheetn").textContent=Object.keys(S.mine).length+"/8";
 const ch=EL("chat");if(ch)ch.scrollTop=ch.scrollHeight;
 save();
}

/* ---- eventos ---- */
function copyTo(txt,tagId){
 const tag=tagId?EL(tagId):null;
 const done=t=>{if(tag)tag.textContent=t};
 try{navigator.clipboard.writeText(txt).then(()=>done("copiado"),()=>done("usa Ctrl+C sobre el texto"))}
 catch(e){done("usa Ctrl+C sobre el texto")}
}
function enterGate(){
 const i=EL("gpass");if(!i)return;
 const h=dj(i.value);
 if(h===ROLES.admin)ROLE="admin";
 else if(h===ROLES.doc)ROLE="doc";
 else{gateErr="Esa clave no corresponde a ningún perfil.";const g=EL("gerr");if(g)g.textContent=gateErr;return}
 try{sessionStorage.setItem("cc1rol",ROLE)}catch(e){}
 gate=false;gateErr="";S.area="pro";S.dstep=0;window.scrollTo(0,0);render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.wrole){wrole=d.wrole;werr="";return render()}
 if(d.wroute){S.route=+d.wroute;return render()}
 if(d.wgo){
  if(wrole==="est"){ROLE="est";S.area="est";entrada=false;window.scrollTo(0,0);return render()}
  if(ROLE!==wrole){
   const esperado=wrole==="admin"?ROLES.admin:ROLES.doc;
   if(dj(wpass)!==esperado){werr=wpass.trim()?"Esa clave no corresponde a este perfil.":"Escribe la clave para continuar.";return render()}
  }
  ROLE=wrole;wpass="";try{sessionStorage.setItem("cc1rol",ROLE)}catch(e){}
  S.area="pro";S.dstep=0;entrada=false;werr="";window.scrollTo(0,0);return render();
 }

 if(d.step!==undefined){S.area==="pro"?S.dstep=+d.step:S.step=+d.step;window.scrollTo(0,0);return render()}
 if(d.go){const last=(S.route===30?6:5);S.step=Math.max(0,Math.min(last,S.step+ +d.go));window.scrollTo(0,0);return render()}
 if(d.route){S.route=+d.route;return render()}
 if(d.mine){S.mine[d.mine]=d.v;return render()}
 if(d.post){S.post[d.post]=d.v;const r=EL("report");if(r)r.value=report();return render()}
 if(d.probe!==undefined){S.probe=d.probe;S.mstep=null;return render()}
 if(b.id==="run"){S.probe=EL("probe").value;S.mstep=null;return render()}
 if(d.m==="start"){S.mstep=1;return render()}
 if(d.m==="next"){S.mstep=(S.mstep||0)+1;return render()}
 if(d.m==="all"){S.mstep=null;return render()}
 if(d.add){const v=EL("newex").value.trim();if(v.length>5){extra.push({t:v,y:d.add});train();EL("newex").value=""}return render()}
 if(b.id==="reset-train"){extra=[];train();return render()}
 if(d.meta!==undefined){const i=+d.meta;S.meta=S.meta.includes(i)?S.meta.filter(x=>x!==i):S.meta.concat(i);return render()}
 if(b.id==="neg"){S.neg=1;return render()}
 if(d.test){S.tested[d.test]=1;return render()}
 if(b.id==="runall"){CASES.forEach(c=>S.tested[c.id]=1);return render()}
 if(b.id==="clear"){S.tested={};return render()}
 if(d.dcase){S.dlg=newDlg(d.dcase);return render()}

 if(b.id==="dreset"){S.dlg=null;return render()}
 if(d.ver){S.veredicto=d.ver;return render()}
 if(d.start){const t=EL("preg");t.value=d.start+" ";t.focus();S.pregunta=t.value;return save()}

 if(b.id==="copyapr"){copyTo(aprendizajePrompt());return}
 if(b.id==="pubapr"){publicar("cc1-aprendizaje",aprend);return}
 if(b.id==="copyaprend"){copyTo(APREND&&APREND.texto||"","acopied");return}
 if(b.id==="copycsv"){
  const cols=["codigo","fecha","ruta","exactitud_modelo","mis_aciertos","dialogo_etapa","dialogo_nivel","dialogo_turnos","veredicto"];
  const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  copyTo([cols.join(";")].concat(POOL.map(p=>cols.map(c=>q(p[c])).join(";"))).join("\n"));return}
 if(b.id==="sheet"){const a=EL("rail");a.classList.toggle("open");b.setAttribute("aria-expanded",a.classList.contains("open"));return}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="resg"){S.resguardo=t.value;save()}
 if(t.id==="preg"){S.pregunta=t.value;save();const r=EL("report");if(r)r.value=report()}
 if(t.id==="wpass"){wpass=t.value;return}
 if(t.id==="hashin"){const o=EL("hashout");if(o)o.textContent=t.value.trim()?dj(t.value)+"  ← pega este número en ROLES":"—"}
 if(t.id==="infotext"){informe=t.value;const b=EL("pubinf");if(b)b.disabled=!(cfgOk()&&informe.length>80)}
 if(t.id==="aprtext"){aprend=t.value;const b=EL("pubapr");if(b)b.disabled=!(cfgOk()&&aprend.length>80)}
 if(t.id==="cfg-nval"){CFG.nval=t.value.replace(/\D/g,"")||0;saveCfg()}
 if(t.id==="stext"){S.peer.sug.text=t.value;save()}
 if(t.id==="sev"){S.peer.sug.ev=t.value;save()}
 if(t.dataset.crit!==undefined){const i=+t.dataset.crit;S.crit=t.checked?S.crit.concat(i):S.crit.filter(x=>x!==i);save();const r=EL("report");if(r)r.value=report()}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="sdim"){S.peer.sug.dim=t.value;save()}
 if(t.id==="ssev"){S.peer.sug.sev=t.value;save()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.id==="wpass"){e.preventDefault();const b=document.querySelector("[data-wgo]");if(b)b.click();return}
 if(e.key==="Enter"&&e.target.id==="gpass"){e.preventDefault();enterGate();return}
 if(e.key==="Escape"&&gate){gate=false;render();return}
 if(e.key==="Enter"&&e.target.id==="probe"){S.probe=e.target.value;S.mstep=null;render()}
 if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="dmsg"){e.preventDefault();const t=e.target.value.trim();if(!t)return;
  const out=tutorTurn(S.dlg,t);S.dlg.turns.push({r:"u",m:t});out.forEach(x=>S.dlg.turns.push({r:"t",m:x}));render()}
});
render();
</script>
